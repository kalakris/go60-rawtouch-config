# Builds firmware for both Go60 halves on every push and pull request, and
# on demand from the Actions tab: Build -> "Run workflow". A pushed tag
# starting with `v` also publishes the two firmware files as a GitHub
# release.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ZMK's reusable build workflow, pinned to the v0.3 release that
    # matches the ZMK 0.3 / Zephyr 3.5 tree in config/west.yml. The copy
    # on ZMK's main branch has since added checks written for Zephyr 4.1
    # trees, so it is not tracked here.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      # Name of the downloadable artifact on a run's summary page. It
      # unpacks to go60_lh-zmk.uf2 (left half) and go60_rh-zmk.uf2 (right
      # half), the names MoErgo's flashing instructions use.
      archive_name: go60-rawtouch-firmware

  release:
    # Only a pushed v* tag publishes; a manual run on a tag ref does not.
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go60-rawtouch-firmware
      - name: Publish the release with both firmware files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" go60_lh-zmk.uf2 go60_rh-zmk.uf2 \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Go60 RawTouch firmware $GITHUB_REF_NAME" \
            --notes "Firmware for both Go60 halves with the stock keymap: flash go60_lh-zmk.uf2 to the left half and go60_rh-zmk.uf2 to the right half. See the README: https://github.com/$GITHUB_REPOSITORY#readme"
