# Settings shared by both halves. ZMK also reads go60_lh.conf for the left
# half and go60_rh.conf for the right half.

# Required by the RawTouch module. The Go60 board definition already
# defaults this on; it is set here so the requirement is visible.
CONFIG_ZMK_POINTING=y

# Headroom for absolute-mode pads reporting about 100 samples per second
# through the input processor chains. ZMK's defaults are a 16-entry input
# queue and a 512-byte input thread stack; when the queue fills, the
# pointer deltas and taps the module injects are silently dropped.
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_INPUT_THREAD_STACK_SIZE=2048
