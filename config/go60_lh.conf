# Left half only. On the stock Go60 the left half is the split central: it
# talks to the computer over USB and Bluetooth and processes both pads.

# Enabled automatically by the raw-touch pad nodes in raw-touch-central.dtsi;
# set explicitly so that a build without those nodes fails here instead of
# quietly producing firmware without RawTouch support.
CONFIG_ZMK_RAW_TOUCH=y

# The module adds a second USB HID interface (HID_1) beside ZMK's own
# (HID_0). The module already defaults this to 2; an explicit lower value
# fails the build.
CONFIG_USB_HID_DEVICE_COUNT=2
