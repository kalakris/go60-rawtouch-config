# Right half only. On the stock Go60 the right half is the split
# peripheral: its pad's samples cross the split link to the left half.

# When the halves talk over Bluetooth instead of the cable, ZMK queues each
# relayed input event and sends it as its own notification. A timestamped
# pad sample is four events (X, Y, timestamp, Z); with eight transmit
# buffers instead of the stock three, one sample's four notifications go
# out in a single connection event instead of two. Harmless on the wired
# link.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
